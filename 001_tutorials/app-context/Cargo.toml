[package]
name = "app-context"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
topcoat = "0.5.0"

[lints.rust]
unsafe_code = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny" 

[lints.clippy]
mod_module_files = "deny"
pedantic = { level = "warn", priority = -1 }
too_many_lines = "allow"

[profile.dev]
debug = true

